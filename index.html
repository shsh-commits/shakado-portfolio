<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Shakado - OSINT portfolio</title>
<meta name="description" content="Shakado: OSINT CTF badges and certifications.">
<link rel="canonical" href="https://shsh-commits.github.io/shakado-portfolio/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://shsh-commits.github.io/shakado-portfolio/">
<meta property="og:image" content="https://shsh-commits.github.io/shakado-portfolio/assets/img/share.png">
<meta property="og:title" content="Shakado - OSINT portfolio">
<meta property="og:description" content="Shakado: OSINT CTF badges and certifications.">
<link rel="icon" type="image/svg+xml" href="assets/img/shakado.svg">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="nav">
  <a class="brand" href="#top">SHAKADO</a>
  <nav>
    <a href="#badges" data-t="badges">Badges</a>
    <a href="#certifications" data-t="certifications">Certifications</a>
    <span class="langs" role="group" data-t-label="language" aria-label="Language">
      <button type="button" data-lang="en" lang="en">EN</button>
      <button type="button" data-lang="fr" lang="fr">FR</button>
    </span>
  </nav>
</header>
<main id="top">
  <noscript><p class="notice">This page needs JavaScript. / Cette page nécessite JavaScript.</p></noscript>
  <p class="notice" id="error" role="alert" hidden></p>

  <section class="profile">
    <img class="av" id="photo" alt="" width="128" height="128" hidden>
    <div>
      <h1 id="name">Shakado</h1>
      <p class="role" id="role"></p>
      <p class="bio" id="bio"></p>
      <div class="socials" id="socials"></div>
    </div>
  </section>

  <section id="badges" class="sec" aria-labelledby="badges-title">
    <h2 id="badges-title" data-t="badges">Badges</h2>
    <div class="carousel" hidden>
      <button class="cbtn prev" type="button" data-t-label="prev" aria-label="Previous">&lsaquo;</button>
      <div class="track" id="track" role="region" tabindex="0" aria-labelledby="badges-title"></div>
      <button class="cbtn next" type="button" data-t-label="next" aria-label="Next">&rsaquo;</button>
    </div>
    <p class="empty" id="no-badges" data-t="noBadges" hidden></p>
  </section>

  <section id="certifications" class="sec" aria-labelledby="certs-title">
    <h2 id="certs-title" data-t="certifications">Certifications</h2>
    <ul class="cert-list" id="certs"></ul>
    <p class="empty" id="no-certs" data-t="noCerts" hidden></p>
  </section>
</main>
<footer>
  <small data-t="credit"></small>
</footer>
<script src="assets/js/app.js" defer></script>
</body>
</html>
